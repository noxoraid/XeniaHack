name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NOXORA_STORE_PASSWORD: ${{ secrets.NOXORA_STORE_PASSWORD }}
      NOXORA_KEY_PASSWORD: ${{ secrets.NOXORA_KEY_PASSWORD }}
      NOXORA_KEY_ALIAS: ${{ secrets.NOXORA_KEY_ALIAS }}
      NOXORA_KEYSTORE_BASE64: ${{ secrets.NOXORA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew
      - name: Restore keystore
        if: env.NOXORA_KEYSTORE_BASE64 != ''
        run: |
          echo "$NOXORA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/noxora.jks"
          echo "NOXORA_KEYSTORE_PATH=$RUNNER_TEMP/noxora.jks" >> "$GITHUB_ENV"
      - run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: uplink-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: uplink-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn
