name: Render UntilyFlow Promo

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render MP4 (1920x1080, 30 fps)
        run: npx remotion render src/index.ts UntilyFlowPromo out/UntilyFlow-Promo.mp4 --codec=h264 --crf=18

      - name: Zip output
        run: cd out && zip -9 ../UntilyFlow-Promo.zip UntilyFlow-Promo.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: untilyflow-promo
          path: |
            out/UntilyFlow-Promo.mp4
            UntilyFlow-Promo.zip
