name: Render video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Periksa musik
        run: |
          if [ ! -f public/music.mp3 ]; then
            echo "::warning::public/music.mp3 belum ada, video dirender tanpa audio"
          fi

      - name: Install dependensi
        run: npm install

      - name: Render video
        run: npm run render

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verifikasi hasil render
        run: |
          F=out/noxora-rest-api.mp4
          P=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_frames -of default=nw=1 "$F")
          echo "$P"
          echo "$P" | grep -qx 'width=1920'
          echo "$P" | grep -qx 'height=1080'
          echo "$P" | grep -qx 'r_frame_rate=60/1'
          echo "$P" | grep -qx 'nb_frames=1740'

      - name: Kemas ZIP
        run: cd out && zip noxora-rest-api-promo.zip noxora-rest-api.mp4

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: noxora-rest-api-promo
          path: out/noxora-rest-api-promo.zip
          compression-level: 0
