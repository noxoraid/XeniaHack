name: render-video

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang dependensi sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y zip libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2
      - run: npm install
      - run: npm run render
      - run: zip -j out/renn-x-japan-landscape.zip out/renn-x-japan-landscape.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: renn-x-japan-landscape
          path: out/renn-x-japan-landscape.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: landscape-${{ github.run_number }}
          name: Renn X Japan landscape ${{ github.run_number }}
          files: out/renn-x-japan-landscape.zip
